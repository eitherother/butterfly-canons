[project]
name = "butterfly-canons"
version = "0.1.0"
description = "An open source generative music improvisation environment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-too-long: several scripts embed long music-data literals
            # (note/instrument-range tables) that are more readable on one
            # line than wrapped; enforcing a hard limit here is just noise.
]

[tool.ruff.lint.isort]
known-first-party = []

[tool.ruff.format]
# These scripts are mostly large literal music-data tables (note sets,
# rhythm grids). The formatter's "one item per line" wrapping makes them
# far less readable, not more, so they're excluded from auto-formatting.
exclude = [
    "piffaro03/score_raw.py",
    "piffaro03/harmony_octaves.py",
    "piffaro03/score_emit.py",
    "piffaro03/midi_notes.py",
]

[tool.uv]
package = false
