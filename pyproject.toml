[project]
name = "butterfly-canons"
version = "0.1.0"
description = "An open source generative music improvisation environment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-too-long: several scripts embed long music-data literals
            # (note/instrument-range tables) that are more readable on one
            # line than wrapped; enforcing a hard limit here is just noise.
]

[tool.ruff.lint.isort]
known-first-party = []

[tool.uv]
package = false
