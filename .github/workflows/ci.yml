name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  scd-syntax-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install SuperCollider
        run: |
          sudo apt-get update
          sudo apt-get install -y supercollider-server supercollider-language
      - name: Compile-check all .scd files
        env:
          QT_QPA_PLATFORM: offscreen
        run: sclang tools/check_scd_syntax.scd "$(pwd)"
